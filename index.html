<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Nature & Doodle Art</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=MonteCarlo&family=Montez&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>Floral Sketchbook</h1>
        <p>Nature's canvas, doodle’s touch – a whimsical masterpiece.</p>
    </header>

    <section class="photo-grid">
        <div class="photo-item">
            <img src="./1.jpg" alt="Cinderella Flower">
            <div class="caption">Cinderella's Petal Gown</div>
        </div>
        <div class="photo-item">
            <img src="./2.jpg" alt="Three Leaves">
            <div class="caption">A Portal to the Sky</div>
        </div>
        <div class="photo-item">
            <img src="./3.jpg" alt="Blue Sky">
            <div class="caption">Love, Doodled & Bloosoms</div>
        </div>
        <div class="photo-item">
            <img src="./4.jpg" alt="Mirror in Garden">
            <div class="caption">The Girl with Floral Tresses</div>
        </div>
        <div class="photo-item">
            <img src="./5.jpg" alt="Doodled Love Page">
            <div class="caption">Daisy's Silent Song</div>
        </div>
        <div class="photo-item">
            <img src="./6.jpg" alt="Lady with Flower Hair">
            <div class="caption">Shaun The Cappuccino</div>
        </div>
        <div class="photo-item">
            <img src="./7.jpg" alt="Extra Image 1">
            <div class="caption">Golden Hours</div>
        </div>
        <div class="photo-item">
            <img src="./8.jpg" alt="Extra Image 2">
            <div class="caption">Moonlit Serenity</div>
        </div>
        <div class="photo-item">
            <img src="./9.jpg" alt="Extra Image 3">
            <div class="caption">3 Idiots</div>
        </div>
    </section>

    <footer>
        <a href="https://in.pinterest.com/shamithrasundar/_created/" target="_blank"> &copy; Shamithra Sundar</a>
    </footer>

</body>
</html>
